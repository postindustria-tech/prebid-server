version: "3.9"
services:
  001_banner:
    platform: linux/amd64
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        - TEST=false
    image: pbs-sample
    container_name: 001_banner
    privileged: true
    ports:
      - "8000:8000"
      - "6060:6060"
    volumes:
      - ../sample/001_banner/app.yaml:/usr/local/bin/pbs.yaml
      - ../sample/001_banner/pbjs.html:/usr/local/bin/static/pbjs.html
      - ../sample/001_banner/stored_request.json:/usr/local/bin/stored_requests/data/by_id/stored_imps/test-imp-id.json
      - ../sample/001_banner/stored_response.json:/usr/local/bin/stored_responses/data/by_id/stored_responses/test-bid-id.json

  002_ad_server_deals:
    platform: linux/amd64
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        - TEST=false
    image: pbs-sample
    container_name: 002_ad_server_deals
    privileged: true
    depends_on:
      - dealsim
    ports:
      - "8000:8000"
      - "6060:6060"
    volumes:
      - ../sample/002_ad_server_deals/app.yaml:/usr/local/bin/pbs.yaml
      - ../sample/002_ad_server_deals/pbjs.html:/usr/local/bin/static/pbjs.html

  dealsim:
    image: golang:1.25
    container_name: dealsim
    working_dir: /dealsim
    command: go run .
    volumes:
      - ../sample/002_ad_server_deals/dealsim:/dealsim
